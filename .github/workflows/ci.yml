name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle dependencies and the wrapper. The Android SDK is preinstalled on ubuntu-latest.
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, screenshot verification and debug build
        run: ./gradlew testDebugUnitTest verifyPaparazziDebug assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/paparazzi/
            app/build/paparazzi/failures/
